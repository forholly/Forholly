<!DOCTYPE html>
<html>
<head>
  <title>Dad's Travels · For Holly</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: Georgia, serif;
    }

    #map {
      height: 100vh;
      width: 100vw;

      filter:
        saturate(1.15)
        brightness(0.98)
        contrast(1.08);
    }

    .home-wrap {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 1000;
    }

    .home {
      color: rgba(255,255,255,0.78);
      text-decoration: none;
      font-size: 1rem;
      display: block;
    }

    .country-count {
      margin-top: 5px;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.52);
      letter-spacing: 0.02em;
    }

    .signature {
      position: fixed;
      bottom: 18px;
      left: 24px;
      z-index: 1000;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.45);
    }

    .memory-pin {
      width: 8px;
      height: 8px;
      background: #1a1a1a;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 0 2px rgba(0,0,0,0.28);
    }

    @media (max-width: 600px) {
      .home {
        font-size: 0.9rem;
      }

      .country-count {
        font-size: 0.62rem;
      }

      .signature {
        font-size: 0.55rem;
      }
    }
  </style>
</head>

<body>

<div class="home-wrap">
  <a href="index.html" class="home">
    ← Home
  </a>

  <div class="country-count">
    Countries visited · 33
  </div>
</div>

<div id="map"></div>

<div class="signature">
  Created with love by Rob Hartshorn · 2026
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map("map", {
  zoomControl: false,
  attributionControl: false,
  worldCopyJump: false
});

L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png",
  {
    subdomains: "abcd",
    noWrap: true
  }
).addTo(map);

const pane = map.createPane("tintPane");
pane.style.zIndex = 350;
pane.style.mixBlendMode = "multiply";

L.rectangle(
  [[-90, -180], [90, 180]],
  {
    pane: "tintPane",
    color: "#2a5f73",
    fillColor: "#2a5f73",
    fillOpacity: 0.14,
    stroke: false
  }
).addTo(map);

L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png",
  {
    opacity: 0.28,
    subdomains: "abcd"
  }
).addTo(map);

const memoryIcon = L.divIcon({
  className: "",
  html: '<div class="memory-pin"></div>',
  iconSize: [8,8],
  iconAnchor: [4,4]
});

function addPin(lat, lng) {
  L.marker([lat, lng], {
    icon: memoryIcon
  }).addTo(map);
}

addPin(41.9028, 12.4964); // Rome
addPin(52.3676, 4.9041); // Amsterdam
addPin(54.3520, 18.6466); // Gdansk
addPin(52.5200, 13.4050); // Berlin
addPin(50.7350, -1.7830); // Highcliffe
addPin(57.1475, -2.0954); // Aberdeen
addPin(57.2842, -2.3776); // Inverurie
addPin(57.3348, -2.3202); // Oldmeldrum
addPin(55.9533, -3.1883); // Edinburgh
addPin(57.1950, -3.8260); // Aviemore
addPin(36.5390, -4.6244); // Fuengirola
addPin(51.5072, -0.1276); // London
addPin(34.7754, 32.4245); // Cyprus
addPin(57.1440, -4.6817); // Caledonian Canal
addPin(52.1364, -0.4667); // Bedford

map.setView([56, -3], 5.8);
</script>

</body>
</html>
