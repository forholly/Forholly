<!DOCTYPE html>
<html>
<head>
  <title>For Holly</title>

  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Georgia, serif;
      background: #f4dfe7;
      color: #383838;
      overflow-x: hidden;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 70px 30px 120px;
    }

    .hero {
      text-align: center;
      margin-bottom: 90px;
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 6rem;
      font-weight: normal;
      margin-bottom: 10px;
      color: #2c2c2c;
    }

    .subtitle {
      font-size: 1.15rem;
      color: #5c5c5c;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 34px;
    }

    .item {
      border-bottom: 1px solid rgba(0,0,0,0.08);
      padding-bottom: 22px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .item:hover {
      transform: translateX(8px);
    }

    .item-title {
      font-size: 2rem;
      transition: color 0.3s ease;
    }

    .item:hover .item-title {
      color: #7a5163;
    }

    @media (max-width: 700px) {
      h1 {
        font-size: 4rem;
      }

      .item-title {
        font-size: 1.5rem;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="hero">
    <h1>For Holly</h1>

    <p class="subtitle">
      A place for memories, adventures, moments.
    </p>
  </div>

  <div class="list">

    <div class="item">
      <div class="item-title">Memories</div>
    </div>

    <div class="item">
      <div class="item-title">Adventures</div>
    </div>

    <div class="item">
      <div class="item-title">Creations</div>
    </div>

    <div class="item">
      <div class="item-title">Timeline</div>
    </div>

  </div>

</div>

</body>
</html>
