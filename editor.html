<!DOCTYPE html>
<html>
<head>
  <title>For Holly Editor</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f2ee;
      font-family: Georgia, serif;
      color: #222;
      padding: 40px 20px;
    }

    .wrap {
      max-width: 760px;
      margin: auto;
    }

    h1 {
      font-weight: normal;
      margin-bottom: 12px;
    }

    .subtle {
      color: rgba(0,0,0,0.55);
      margin-bottom: 35px;
      font-size: 0.95rem;
    }

    label {
      display: block;
      margin-top: 24px;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid rgba(0,0,0,0.14);
      border-radius: 10px;
      font-family: Georgia, serif;
      font-size: 1rem;
      background: white;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
      line-height: 1.6;
    }

    input[type="file"] {
      margin-top: 8px;
    }

    .checkboxes {
      display: flex;
      gap: 28px;
      margin-top: 8px;
    }

    .checkboxes label {
      margin: 0;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button {
      margin-top: 40px;
      padding: 14px 22px;
      border: none;
      border-radius: 10px;
      background: #e8d9dd;
      font-family: Georgia, serif;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.92;
    }
  </style>
</head>

<body>

<div class="wrap">

  <h1>For Holly Editor</h1>

  <div class="subtle">
    Create a memory page.
  </div>

  <label>Who remembers this?</label>

  <div class="checkboxes">
    <label>
      <input type="checkbox" id="dad">
      Dad
    </label>

    <label>
      <input type="checkbox" id="holly">
      Holly
    </label>
  </div>

  <label>Location *</label>
  <input
    type="text"
    id="location"
    placeholder="Location"
  >

  <label>Page title *</label>
  <input
    type="text"
    id="title"
    placeholder="Page title"
  >

  <label>Story</label>
  <textarea
    id="story"
    placeholder="Optional..."
  ></textarea>

  <label>Photos</label>
  <input
    type="file"
    id="photos"
    accept="image/*"
    multiple
  >

  <button onclick="createPage()">
    Create Page
  </button>

</div>

<script>
function slugify(text) {
  return text
    .toLowerCase()
    .trim()
    .replace(/\s+/g, "-")
    .replace(/[^\w\-]+/g, "");
}

function fileToDataURL(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();

    reader.onload = function(e) {
      resolve(e.target.result);
    };

    reader.readAsDataURL(file);
  });
}

async function createPage() {

  const dad =
    document.getElementById("dad").checked;

  const holly =
    document.getElementById("holly").checked;

  const location =
    document.getElementById("location")
    .value
    .trim();

  const title =
    document.getElementById("title")
    .value
    .trim();

  const story =
    document.getElementById("story")
    .value
    .trim();

  const photos =
    document.getElementById("photos")
    .files;

  if (!location) {
    alert("Please add a location.");
    return;
  }

  if (!title) {
    alert("Please add a page title.");
    return;
  }

  let prefix = "holly";

  if (dad && holly) {
    prefix = "shared";
  } else if (dad) {
    prefix = "dad";
  }

  const filename =
    prefix + "-" +
    slugify(location) +
    ".html";

  let mapLink =
    "map.html";

  let mapText =
    "← Holly's Places";

  if (prefix === "dad") {
    mapLink = "dad-";
    mapText = "← Dad's Places";
  }

  const imageData =
    await Promise.all(
      Array.from(photos).map(file =>
        fileToDataURL(file)
      )
    );

  const slidesHtml =
    imageData.map((image, index) => `
      <div class="slide ${index === 0 ? "active" : ""}">
        <img
          src="${image}"
          class="photo"
        >
      </div>
    `).join("");

  const html =
`<!DOCTYPE html>
<html>
<head>
  <title>${title} · For Holly</title>

  <meta name="viewport"
  content="width=device-width, initial-scale=1">

  <style>
    *{
      box-sizing:border-box;
    }

    html, body{
      margin:0;
      height:100%;
      overflow:hidden;
      background:#111;
      font-family:Georgia, serif;
      color:white;
      touch-action:pan-y;
    }

    .nav{
      position:fixed;
      top:24px;
      left:24px;
      z-index:1000;
    }

    .nav a{
      display:block;
      text-decoration:none;
      color:rgba(255,255,255,0.72);
      margin-bottom:6px;
    }

    .top-content{
      position:fixed;
      top:40px;
      left:50%;
      transform:translateX(-50%);
      z-index:1000;
      width:min(90vw, 760px);
      text-align:center;
      pointer-events:none;
    }

    h1{
      margin:0 0 14px;
      font-weight:normal;
      font-size:2rem;
      color:white;
    }

    .story{
      color:rgba(255,255,255,0.82);
      line-height:1.6;
      font-size:1rem;
      max-width:720px;
      margin:auto;
    }

    .viewer{
      position:relative;
      width:100vw;
      height:100vh;
      overflow:hidden;
    }

    .slide{
      position:absolute;
      inset:0;

      display:flex;
      justify-content:center;
      align-items:center;

      opacity:0;
      transform:translateX(80px);

      transition:
        opacity 1.4s ease,
        transform 1.4s ease;

      pointer-events:none;
      padding:190px 24px 70px;
    }

    .slide.active{
      opacity:1;
      transform:translateX(0);
      pointer-events:auto;
      z-index:2;
    }

    .slide.exit-left{
      opacity:0;
      transform:translateX(-90px);
    }

    .slide.exit-right{
      opacity:0;
      transform:translateX(90px);
    }

    .photo{
      width:min(84vw, 760px);
      height:min(62vh, 620px);
      object-fit:contain;
      border-radius:20px;
      display:block;
    }

    .arrow{
      position:fixed;
      top:50%;
      transform:translateY(-50%);
      z-index:1000;

      width:54px;
      height:54px;
      border-radius:50%;
      border:none;

      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(10px);

      color:rgba(255,255,255,0.85);
      font-size:1.5rem;
      cursor:pointer;
    }

    .left{
      left:24px;
    }

    .right{
      right:24px;
    }

    .counter{
      position:fixed;
      bottom:22px;
      left:50%;
      transform:translateX(-50%);
      color:rgba(255,255,255,0.36);
      font-size:0.72rem;
    }

    @media (max-width:600px){

      .top-content{
        top:26px;
      }

      h1{
        font-size:1.5rem;
      }

      .story{
        font-size:0.92rem;
      }

      .photo{
        width:92vw;
        height:58vh;
      }

      .arrow{
        width:42px;
        height:42px;
        font-size:1.15rem;
      }

      .left{
        left:12px;
      }

      .right{
        right:12px;
      }
    }
  </style>
</head>

<body>

<div class="nav">

  <a href="index.html">
    ← Home
  </a>

  <a href="${mapLink}">
    ${mapText}
  </a>

</div>

<div class="top-content">

  <h1>${title}</h1>

  <div class="story">
    ${story.replace(/\n/g, "<br>")}
  </div>

</div>

<div class="viewer">

  ${slidesHtml}

</div>

<button class="arrow left"
onclick="changeSlide(-1)">
  ‹
</button>

<button class="arrow right"
onclick="changeSlide(1)">
  ›
</button>

<div class="counter" id="counter">
  1 / ${imageData.length}
</div>

<script>
const slides =
  document.querySelectorAll(".slide");

const counter =
  document.getElementById("counter");

let current = 0;
let transitionId = 0;

function changeSlide(direction){

  transitionId++;

  const thisTransition =
    transitionId;

  const currentSlide =
    slides[current];

  currentSlide.classList.remove(
    "exit-left",
    "exit-right"
  );

  currentSlide.classList.add(
    direction === 1
      ? "exit-left"
      : "exit-right"
  );

  let next =
    current + direction;

  if(next < 0)
    next = slides.length - 1;

  if(next >= slides.length)
    next = 0;

  const nextSlide =
    slides[next];

  nextSlide.classList.add("active");

  current = next;

  counter.textContent =
    \`\${current + 1} / \${slides.length}\`;

  setTimeout(() => {

    if(thisTransition !== transitionId)
      return;

    slides.forEach(slide => {

      slide.classList.remove(
        "exit-left",
        "exit-right"
      );

      if(slide !== slides[current]){
        slide.classList.remove(
          "active"
        );
      }
    });

  }, 1400);
}

let startX = 0;

document.addEventListener(
  "touchstart",
  e => {
    startX =
      e.touches[0].clientX;
  }
);

document.addEventListener(
  "touchend",
  e => {

    const diff =
      startX -
      e.changedTouches[0].clientX;

    if(diff > 50)
      changeSlide(1);

    if(diff < -50)
      changeSlide(-1);
  }
);
</script>

</body>
</html>`;

  const blob = new Blob(
    [html],
    { type: "text/html" }
  );

  const a =
    document.createElement("a");

  a.href =
    URL.createObjectURL(blob);

  a.download =
    filename;

  document.body.appendChild(a);

  a.click();

  document.body.removeChild(a);

  URL.revokeObjectURL(a.href);
}
</script>

</body>
</html>
