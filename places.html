<!DOCTYPE html>
<html>
<head>
  <title>Places · For Holly</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Georgia, serif;
      background: #000;
      color: white;
      overflow-x: hidden;
    }

    .hero {
      min-height: 100vh;
      background-image:
        linear-gradient(
          to right,
          rgba(0,0,0,0.50) 0%,
          rgba(0,0,0,0.22) 35%,
          rgba(0,0,0,0.08) 60%,
          rgba(0,0,0,0.12) 100%
        ),
        url('hero.jpg.jfif');
      background-size: cover;
      background-position: center center;
    }

    .container {
      padding: 9vh 8%;
      max-width: 900px;
    }

    .back {
      display: inline-block;
      margin-bottom: 45px;
      color: rgba(255,255,255,0.65);
      text-decoration: none;
      transition: 0.25s ease;
      font-size: 0.95rem;
    }

    .back:hover {
      color: white;
      transform: translateX(-4px);
    }

    h1 {
      font-weight: 300;
      font-size: 2.8rem;
      margin-bottom: 35px;
      text-shadow: 0 3px 16px rgba(0,0,0,0.3);
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .item {
      width: fit-content;
      font-size: 1.5rem;
      font-weight: 300;
      color: rgba(255,255,255,0.82);
      cursor: pointer;
      transition: 0.28s ease;
    }

    .item:hover {
      transform: translateX(6px);
      color: white;
    }

    .signature {
      position: fixed;
      bottom: 18px;
      left: 24px;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.45);
    }

    @media (max-width: 600px) {
      .container {
        padding: 7vh 8%;
      }

      h1 {
        font-size: 2rem;
        margin-bottom: 24px;
      }

      .item {
        font-size: 1rem;
      }

      .back {
        font-size: 0.85rem;
        margin-bottom: 30px;
      }

      .signature {
        font-size: 0.55rem;
      }
    }
  </style>
</head>

<body>

<section class="hero">
  <div class="container">

    <a href="index.html" class="back">← Home</a>

    <h1>Places</h1>

    <div class="list">
      <div class="item">No Legs Required</div>
      <div class="item">Legs Required</div>
      <div class="item">Car Required</div>
      <div class="item">Plane Required</div>
    </div>

  </div>

  <div class="signature">
    Created with love by Rob Hartshorn · 2026
  </div>
</section>

</body>
</html>
