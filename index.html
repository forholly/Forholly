<!DOCTYPE html>
<html>
<head>
  <title>For Holly</title>

  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, serif;
      overflow-x: hidden;
      background: #000;
    }

    .hero {
      position: relative;
      min-height: 100vh;

      background-image:
        linear-gradient(
          to right,
          rgba(0,0,0,0.50) 0%,
          rgba(0,0,0,0.30) 30%,
          rgba(0,0,0,0.08) 60%,
          rgba(0,0,0,0.12) 100%
        ),
        url('hero.jpg.jfif');

      background-size: cover;
      background-position: center center;

      display: flex;
      align-items: center;
    }

    .content {
      padding-left: 8%;
      max-width: 600px;
      color: white;
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 7rem;
      font-weight: normal;
      margin: 0 0 10px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.35);
    }

    .subtitle {
      font-size: 1.15rem;
      color: rgba(255,255,255,0.88);
      margin-bottom: 60px;
      letter-spacing: 0.5px;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .item {
      width: fit-content;
      font-size: 2rem;
      color: rgba(255,255,255,0.82);
      cursor: pointer;
      transition: all 0.28s ease;
    }

    .item:hover {
      transform: translateX(10px);
      color: white;
    }

    @media (max-width: 900px) {
      .hero {
        background-position: 70% center;
      }

      h1 {
        font-size: 5rem;
      }

      .item {
        font-size: 1.6rem;
      }

      .content {
        padding: 40px;
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 4rem;
      }

      .subtitle {
        font-size: 1rem;
      }

      .item {
        font-size: 1.4rem;
      }
    }
  </style>
</head>

<body>

<section class="hero">

  <div class="content">

    <h1>For Holly</h1>

    <p class="subtitle">
      memories • adventures • moments
    </p>

    <div class="list">
      <div class="item">Memories</div>
      <div class="item">Adventures</div>
      <div class="item">Creations</div>
      <div class="item">Timeline</div>
    </div>

  </div>

</section>

</body>
</html>
