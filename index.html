<!DOCTYPE html>
<html>
<head>
  <title>For Holly</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, serif;
      overflow-x: hidden;
      background: #000;
    }

    .hero {
      position: relative;
      min-height: 100vh;

      background-image:
        linear-gradient(
          to right,
          rgba(0,0,0,0.45) 0%,
          rgba(0,0,0,0.22) 35%,
          rgba(0,0,0,0.05) 60%,
          rgba(0,0,0,0.10) 100%
        ),
        url('hero.jpg.jfif');

      background-size: cover;
      background-position: center center;

      display: flex;
      align-items: flex-start;
    }

    .content {
      padding-left: 8%;
      padding-top: 10vh;
      color: white;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .item {
      width: fit-content;
      font-size: 1.55rem;
      font-weight: 300;
      color: rgba(255,255,255,0.82);
      cursor: pointer;
      transition: all 0.28s ease;
      letter-spacing: 0.2px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.25);
      text-decoration: none;
      display: block;
    }

    .item:hover {
      transform: translateX(6px);
      color: white;
    }

    .signature {
      position: absolute;
      bottom: 18px;
      left: 24px;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.3px;
    }

    @media (max-width: 900px) {
      .hero {
        background-position: 70% center;
      }

      .content {
        padding: 40px;
        padding-top: 9vh;
      }

      .item {
        font-size: 1.35rem;
      }
    }

    @media (max-width: 600px) {
      .item {
        font-size: 1.2rem;
      }

      .signature {
        font-size: 0.6rem;
      }
    }
  </style>
</head>

<body>

<section class="hero">

  <div class="content">

    <div class="list">
      <a href="places.html" class="item">Places</a>
      <a href="years.html" class="item">Years</a>
      <a href="creations.html" class="item">Creations</a>
    </div>

  </div>

  <div class="signature">
    Created with love by Rob Hartshorn · 2026
  </div>

</section>

</body>
</html>
