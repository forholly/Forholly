<!DOCTYPE html>
<html>
<head>
  <title>Dad's Travels · For Holly</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: Georgia, serif;
    }

    #map {
      height: 100vh;
      width: 100vw;

      filter:
        saturate(1.15)
        brightness(0.98)
        contrast(1.08);
    }

    .home-wrap {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 1000;
    }

    .home {
      color: rgba(255,255,255,0.78);
      text-decoration: none;
      font-size: 1rem;
      display: block;
    }

    .country-count {
      margin-top: 5px;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.52);
      letter-spacing: 0.02em;
    }

    .signature {
      position: fixed;
      bottom: 18px;
      left: 24px;
      z-index: 1000;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.45);
    }

    .memory-pin {
      width: 8px;
      height: 8px;
      background: #1a1a1a;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 0 2px rgba(0,0,0,0.28);
    }

    @media (max-width: 600px) {
      .home {
        font-size: 0.9rem;
      }

      .country-count {
        font-size: 0.62rem;
      }

      .signature {
        font-size: 0.55rem;
      }
    }
  </style>
</head>

<body>

<div class="home-wrap">
  <a href="index.html" class="home">
    ← Home
  </a>

  <div class="country-count">
    Countries visited · 33
  </div>
</div>

<div id="map"></div>

<div class="signature">
  Created with love by Rob Hartshorn · 2026
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map("map", {
  zoomControl: false,
  attributionControl: false,
  worldCopyJump: false
});

L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png",
  {
    subdomains: "abcd",
    noWrap: true
  }
).addTo(map);

const pane = map.createPane("tintPane");
pane.style.zIndex = 350;
pane.style.mixBlendMode = "multiply";

L.rectangle(
  [[-90, -180], [90, 180]],
  {
    pane: "tintPane",
    color: "#2a5f73",
    fillColor: "#2a5f73",
    fillOpacity: 0.14,
    stroke: false
  }
).addTo(map);

L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png",
  {
    opacity: 0.28,
    subdomains: "abcd"
  }
).addTo(map);

const memoryIcon = L.divIcon({
  className: "",
  html: '<div class="memory-pin"></div>',
  iconSize: [8,8],
  iconAnchor: [4,4]
});

function addPin(lat, lng) {
  L.marker([lat, lng], {
    icon: memoryIcon
  }).addTo(map);
}

/* Shared places */
addPin(41.9028, 12.4964); // Rome
addPin(50.7350, -1.7830); // Highcliffe
addPin(52.3676, 4.9041); // Amsterdam
addPin(54.3520, 18.6466); // Gdansk
addPin(52.5200, 13.4050); // Berlin
addPin(57.1475, -2.0954); // Aberdeen
addPin(57.2842, -2.3776); // Inverurie
addPin(57.3348, -2.3202); // Oldmeldrum
addPin(55.9533, -3.1883); // Edinburgh
addPin(57.1950, -3.8260); // Aviemore
addPin(36.5390, -4.6244); // Fuengirola
addPin(51.5072, -0.1276); // London
addPin(34.7754, 32.4245); // Cyprus
addPin(57.1440, -4.6817); // Caledonian Canal
addPin(52.1364, -0.4667); // Bedford

/* Europe / UK */
addPin(54.5973, -5.9301); // Belfast
addPin(58.1467, 7.9956); // Kristiansand
addPin(60.3913, 5.3221); // Bergen
addPin(57.4125, -6.1940); // Isle of Skye
addPin(56.4978, -6.8692); // Isle of Mull
addPin(58.9847, -2.9605); // Orkney
addPin(60.1550, -1.1450); // Shetlands
addPin(50.8503, 4.3517); // Brussels
addPin(68.9585, 33.0827); // Murmansk
addPin(56.9496, 24.1052); // Riga
addPin(49.2144, -2.1313); // Jersey
addPin(37.1028, -8.6742); // Lagos Portugal

/* Spain / islands */
addPin(38.5411, -0.1225); // Benidorm
addPin(36.5957, -4.6373); // Mijas
addPin(36.1408, -5.3536); // Gibraltar
addPin(28.1235, -15.4363); // Las Palmas
addPin(28.5004, -13.8627); // Fuerteventura

/* Africa */
addPin(6.5244, 3.3792); // Lagos Nigeria
addPin(5.3599, -4.0083); // Ivory Coast
addPin(5.6037, -0.1870); // Ghana
addPin(-4.4419, 15.2663); // DR Congo
addPin(-8.8390, 13.2894); // Angola
addPin(30.0444, 31.2357); // Egypt

/* Middle East */
addPin(29.3759, 47.9774); // Kuwait
addPin(25.2854, 51.5310); // Qatar
addPin(24.4539, 54.3773); // Abu Dhabi

/* Asia */
addPin(18.7883, 98.9853); // Chiang Mai
addPin(13.7563, 100.5018); // Bangkok
addPin(3.1390, 101.6869); // Kuala Lumpur
addPin(19.0760, 72.8777); // Mumbai
addPin(11.6234, 92.7265); // Andaman Islands
addPin(12.0480, 102.3210); // Koh Chang
addPin(35.5384, 129.3114); // Ulsan

/* Americas */
addPin(36.1699, -115.1398); // Las Vegas
addPin(39.9526, -75.1652); // Philadelphia
addPin(35.0844, -106.6504); // Albuquerque
addPin(41.8781, -87.6298); // Chicago
addPin(43.6591, -70.2568); // Maine
addPin(19.4326, -99.1332); // Mexico City
addPin(18.6517, -91.8075); // Ciudad del Carmen
addPin(4.7110, -74.0721); // Bogota
addPin(10.3910, -75.4794); // Cartagena
addPin(53.5461, -113.4938); // Edmonton
addPin(53.3017, -60.3258); // Goose Bay

/* Other */
addPin(13.1939, -59.5432); // Barbados
addPin(-31.9505, 115.8605); // Perth Australia

map.setView([30, 0], 2.2);
</script>

</body>
</html>
