<!DOCTYPE html>
<html>
<head>
  <title>Creations · For Holly</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Georgia, serif;
      background: #000;
      color: white;
      overflow: hidden;
    }

    .hero {
      min-height: 100vh;

      background-image:
        linear-gradient(
          to right,
          rgba(0,0,0,0.50) 0%,
          rgba(0,0,0,0.22) 35%,
          rgba(0,0,0,0.08) 60%,
          rgba(0,0,0,0.12) 100%
        ),
        url('nutter.jpg.jfif');

      background-size: cover;
      background-position: center center;
    }

    .container {
      padding: 8vh 8%;
    }

    .back {
      display: inline-block;
      margin-bottom: 35px;
      color: rgba(255,255,255,0.65);
      text-decoration: none;
      transition: 0.25s ease;
      font-size: 0.95rem;
    }

    .back:hover {
      color: white;
      transform: translateX(-4px);
    }

    h1 {
      font-weight: 300;
      font-size: 2.8rem;
      margin: 0;
      text-shadow: 0 3px 16px rgba(0,0,0,0.3);
    }

    .signature {
      position: fixed;
      bottom: 18px;
      left: 24px;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.45);
    }

    @media (max-width: 600px) {
      .container {
        padding: 7vh 8%;
      }

      h1 {
        font-size: 2rem;
      }

      .back {
        font-size: 0.85rem;
      }

      .signature {
        font-size: 0.55rem;
      }
    }
  </style>
</head>

<body>

<section class="hero">

  <div class="container">

    <a href="index.html" class="back">← Home</a>

    <h1>Creations</h1>

  </div>

  <div class="signature">
    Created with love by Rob Hartshorn · 2026
  </div>

</section>

</body>
</html>
