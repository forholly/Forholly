<!DOCTYPE html>
<html>
<head>
  <title>For Holly</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, serif;
      background: #000;
      color: white;
      overflow: hidden;
    }

    .hero {
      min-height: 100vh;
      background-image:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.15),
          rgba(0,0,0,0.25)
        ),
        url('hero.jpg.jfif');

      background-size: cover;
      background-position: center center;
      position: relative;
    }

    .container {
      position: absolute;
      top: 22%;
      left: 8%;
    }

    h1 {
      margin: 0 0 22px 0;
      font-size: 2.5rem;
      font-weight: 300;
      text-shadow: 0 3px 16px rgba(0,0,0,0.3);
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu a {
      color: rgba(255,255,255,0.82);
      text-decoration: none;
      font-size: 1.15rem;
      font-family: Arial, sans-serif;
      transition: 0.25s ease;
      width: fit-content;
    }

    .menu a:hover {
      color: white;
      transform: translateX(5px);
    }

    .signature {
      position: fixed;
      bottom: 18px;
      left: 24px;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.45);
    }

    @media (max-width: 600px) {
      .container {
        top: 20%;
        left: 8%;
      }

      h1 {
        font-size: 2rem;
      }

      .menu a {
        font-size: 1rem;
      }

      .signature {
        font-size: 0.55rem;
      }
    }
  </style>
</head>

<body>

<section class="hero">

  <div class="container">

    <h1>For Holly</h1>

    <div class="menu">
      <a href="map.html">Places</a>
      <a href="years.html">Years</a>
      <a href="creations.html">Creations</a>
    </div>

  </div>

  <div class="signature">
    Created with love by Rob Hartshorn · 2026
  </div>

</section>

</body>
</html>
