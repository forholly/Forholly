<!DOCTYPE html>
<html>
<head>
  <title>2025 · For Holly</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, serif;
      background: #000;
      color: white;
    }

    .hero {
      min-height: 100vh;

      background-image:
        linear-gradient(
          to right,
          rgba(0,0,0,0.48) 0%,
          rgba(0,0,0,0.24) 35%,
          rgba(0,0,0,0.12) 60%,
          rgba(0,0,0,0.16) 100%
        ),
        url('attack.jpg.jfif');

      background-size: cover;
      background-position: center 25%;
      background-repeat: no-repeat;
    }

    .container {
      padding: 8vh 8%;
      max-width: 700px;
    }

    .back {
      display: inline-block;
      margin-bottom: 40px;
      color: rgba(255,255,255,0.65);
      text-decoration: none;
      font-size: 0.95rem;
    }

    h1 {
      font-weight: normal;
      font-size: clamp(2rem, 5vw, 3.5rem);
      margin: 0 0 24px 0;
    }

    .coming-soon {
      font-size: 1rem;
      color: rgba(255,255,255,0.7);
      line-height: 1.8;
    }

    .signature {
      position: fixed;
      bottom: 18px;
      left: 24px;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.45);
    }

    @media (max-width: 600px) {
      .container {
        padding: 7vh 8%;
      }

      .back {
        font-size: 0.85rem;
      }

      .coming-soon {
        font-size: 0.92rem;
      }

      .signature {
        font-size: 0.55rem;
      }
    }
  </style>
</head>

<body>

<section class="hero">

  <div class="container">

    <a href="years.html" class="back">
      ← Years
    </a>

    <h1>2025</h1>

    <div class="coming-soon">
      Memories from this year will live here.
    </div>

  </div>

</section>

<div class="signature">
  Created with love by Rob Hartshorn · 2026
</div>

</body>
</html>
