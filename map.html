<!DOCTYPE html>
<html>
<head>
  <title>Map · For Holly</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Georgia, serif;
      background: #000;
      color: white;
      overflow: hidden;
    }

    #map {
      height: 100vh;
      width: 100vw;
    }

    /* Weird dreamy map colours */
    .leaflet-tile {
      filter:
        hue-rotate(185deg)
        saturate(1.35)
        brightness(0.84)
        contrast(1.08);
    }

    .overlay {
      position: absolute;
      top: 40px;
      left: 40px;
      z-index: 1000;
      text-shadow: 0 3px 18px rgba(0,0,0,0.45);
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: rgba(255,255,255,0.78);
      text-decoration: none;
      font-size: 0.95rem;
      transition: 0.25s ease;
    }

    .back:hover {
      color: white;
      transform: translateX(-4px);
    }

    h1 {
      font-size: 2rem;
      font-weight: 300;
      margin: 0;
    }

    .signature {
      position: fixed;
      bottom: 18px;
      left: 24px;
      z-index: 1000;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.45);
    }

    @media (max-width: 600px) {
      .overlay {
        top: 25px;
        left: 25px;
      }

      h1 {
        font-size: 1.5rem;
      }

      .back {
        font-size: 0.85rem;
      }

      .signature {
        font-size: 0.55rem;
      }
    }
  </style>
</head>

<body>

<div class="overlay">
  <a href="places.html" class="back">← Places</a>
  <h1 id="map-title">Places</h1>
</div>

<div id="map"></div>

<div class="signature">
  Created with love by Rob Hartshorn · 2026
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const params = new URLSearchParams(window.location.search);
  const mode = params.get("mode");

  const map = L.map('map', {
    zoomControl: false,
    worldCopyJump: false
  });

  /* No clutter roads */
  L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',
    {
      attribution: '&copy; OpenStreetMap',
      noWrap: true
    }
  ).addTo(map);

  /* Major labels only */
  L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png',
    {
      opacity: 0.30,
      noWrap: true
    }
  ).addTo(map);

  if (mode === "plane") {
    document.getElementById("map-title").textContent =
      "Plane Required";

    map.setView([20, 0], 2.3);
  }

  else if (mode === "car") {
    document.getElementById("map-title").textContent =
      "Car Required";

    map.setView([56, -3], 6);
  }

  else if (mode === "legs") {
    document.getElementById("map-title").textContent =
      "Legs Required";

    map.setView([57.33, -2.38], 11.4);
  }

  else {
    document.getElementById("map-title").textContent =
      "Places";

    map.setView([55, -3], 5);
  }
</script>

</body>
</html>
