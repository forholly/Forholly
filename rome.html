<!DOCTYPE html>
<html>
<head>
  <title>Rome · For Holly</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Georgia, serif;
      color: white;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 1000;
    }

    .back {
      color: rgba(255,255,255,0.72);
      text-decoration: none;
      font-size: 0.95rem;
    }

    .title {
      margin-top: 6px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.03em;
    }

    .slider {
      height: 100vh;
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;

      -webkit-overflow-scrolling: touch;
    }

    .slider::-webkit-scrollbar {
      display: none;
    }

    .slide {
      min-width: 100vw;
      height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      scroll-snap-align: center;
      padding: 80px 20px 40px;
    }

    .photo {
      max-width: min(92vw, 900px);
      max-height: 82vh;

      border-radius: 22px;
      object-fit: contain;
      display: block;
    }

    .hint {
      position: fixed;
      bottom: 18px;
      right: 24px;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.32);
      z-index: 1000;
    }

    @media (max-width: 600px) {
      .back {
        font-size: 0.85rem;
      }

      .title {
        font-size: 0.72rem;
      }

      .slide {
        padding: 80px 12px 30px;
      }

      .photo {
        max-width: 96vw;
        max-height: 78vh;
        border-radius: 16px;
      }

      .hint {
        font-size: 0.55rem;
        right: 18px;
      }
    }
  </style>
</head>

<body>

<div class="top-bar">
  <a href="map.html" class="back">
    ← Places
  </a>

  <div class="title">
    Rome
  </div>
</div>

<div class="slider">

  <section class="slide">
    <img src="rome1.jfif" class="photo" alt="Rome photo 1">
  </section>

  <section class="slide">
    <img src="rome2.jfif" class="photo" alt="Rome photo 2">
  </section>

  <section class="slide">
    <img src="rome3.jfif" class="photo" alt="Rome photo 3">
  </section>

</div>

<div class="hint">
  ← swipe →
</div>

</body>
</html>
