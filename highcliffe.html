<!DOCTYPE html>
<html>
<head>
  <title>Highcliffe · For Holly</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0f0f0f;
      overflow: hidden;
      font-family: Georgia, serif;
      color: white;
    }

    .hero {
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .placeholder {
      font-size: 1rem;
      opacity: 0.45;
      letter-spacing: 0.05em;
    }

    .back {
      position: absolute;
      top: 24px;
      left: 24px;
      color: rgba(255,255,255,0.82);
      text-decoration: none;
      font-size: 1rem;
    }

    .signature {
      position: absolute;
      bottom: 18px;
      left: 24px;
      color: rgba(255,255,255,0.45);
      font-size: 0.7rem;
    }

    @media (max-width: 600px) {
      .back {
        font-size: 0.9rem;
      }

      .signature {
        font-size: 0.55rem;
      }
    }
  </style>
</head>

<body>

<div class="hero">

  <a href="map.html" class="back">
    ← Map

  <div class="placeholder">
