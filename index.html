<!DOCTYPE html>
<html>
<head>
  <title>For Holly</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, serif;
      overflow: hidden;
      background: black;
    }

    .hero {
      height: 100vh;
      background-image:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.18),
          rgba(0,0,0,0.28)
        ),
        url('hero.jpg.jfif');

      background-size: cover;
      background-position: center center;

      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 7vh 8%;
    }

    .menu {
      margin-top: 20vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .menu a {
      color: rgba(255,255,255,0.9);
      text-decoration: none;
      font-size: 1.45rem;
      font-weight: 300;
      transition: 0.25s ease;
      width: fit-content;
    }

    .menu a:hover {
      transform: translateX(6px);
    }

    .dad-section {
      margin-top: 26px;
    }

    .dad-section a {
      font-size: 1.18rem;
      color: rgba(255,255,255,0.62);
    }

    .dad-section a:hover {
      color: rgba(255,255,255,0.82);
    }

    .signature {
      position: fixed;
      bottom: 18px;
      left: 24px;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.45);
    }

    @media (max-width: 600px) {
      .menu {
        margin-top: 18vh;
      }

      .menu a {
        font-size: 1.1rem;
      }

      .dad-section {
        margin-top: 22px;
      }

      .dad-section a {
        font-size: 0.95rem;
      }

      .signature {
        font-size: 0.55rem;
      }
    }
  </style>
</head>

<body>

<section class="hero">

  <div class="menu">
    <a href="map.html">Places</a>
    <a href="years.html">Years</a>
    <a href="creations.html">Creations</a>

    <div class="dad-section">
      <a href="dad-map.html">Dad’s Travels</a>
    </div>
  </div>

</section>

<div class="signature">
  Created with love by Rob Hartshorn · 2026
</div>

</body>
</html>
