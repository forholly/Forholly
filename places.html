<!DOCTYPE html>
<html>
<head>
  <title>Places · For Holly</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, serif;
      background: #000;
      color: white;
      overflow-x: hidden;
    }

    .hero {
      min-height: 100vh;

      background-image:
        linear-gradient(
          to right,
          rgba(0,0,0,0.50) 0%,
          rgba(0,0,0,0.22) 35%,
          rgba(0,0,0,0.08) 60%,
          rgba(0,0,0,0.12) 100%
        ),
        url('hero.jpg.jfif');

      background-size: cover;
      background-position: center center;
    }

    .container {
      padding: 9vh 8%;
      max-width: 900px;
    }

    .back {
      display: inline-block;
      margin-bottom: 60px;
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      transition: 0.25s ease;
      font-size: 1rem;
    }

    .back:hover {
      color: white;
      transform: translateX(-4px);
    }

    h1 {
      font-weight: 300;
      font-size: 2.8rem;
      margin-bottom: 50px;
      text-shadow: 0 3px 16px rgba(0,0,0,0.3);
    }

    .section {
      margin-bottom: 55px;
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 300;
      margin-bottom: 18px;
      color: rgba(255,255,255,0.92);
    }

    .place {
      font-size: 1.2rem;
      margin-bottom: 12px;
      color: rgba(255,255,255,0.74);
      cursor: pointer;
      transition: 0.25s ease;
      width: fit-content;
      font-weight: 300;
    }

    .place:hover {
      color: white;
      transform: translateX(6px);
    }

    .signature {
      position: fixed;
      bottom: 18px;
      left: 24px;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.45);
    }

    @media (max-width: 600px) {
      .section-title {
        font-size: 1.3rem;
      }

      .place {
        font-size: 1.05rem;
      }

      .signature {
        font-size: 0.6rem;
      }
    }
  </style>
</head>

<body>

<section class="hero">

  <div class="container">

    <a href="index.html" class="back">← Home</a>

    <h1>Places</h1>

    <div class="section">
      <div class="section-title">No Legs Required</div>

      <div class="place">Christmas</div>
      <div class="place">Garden Days</div>
      <div class="place">Movie Nights</div>
      <div class="place">Baking</div>
    </div>

    <div class="section">
      <div class="section-title">Legs Required</div>

      <div class="place">Duck Pond</div>
      <div class="place">Inverurie</div>
      <div class="place">Parks</div>
      <div class="place">Local Adventures</div>
    </div>

    <div class="section">
      <div class="section-title">Car Required</div>

      <div class="place">Cairngorms</div>
      <div class="place">Aberdeen</div>
      <div class="place">Edinburgh</div>
      <div class="place">Cornwall</div>
    </div>

    <div class="section">
      <div class="section-title">Plane Required</div>

      <div class="place">Vietnam</div>
      <div class="place">Thailand</div>
      <div class="place">Tenerife</div>
      <div class="place">Norway</div>
    </div>

  </div>

  <div class="signature">
    Created with love by Rob Hartshorn · 2026
  </div>

</section>

</body>
</html>
