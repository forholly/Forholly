<!DOCTYPE html>
<html>
<head>
  <title>Rome · For Holly</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Georgia, serif;
      color: white;
      touch-action: pan-y;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .top-bar {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 1000;
    }

    .back {
      color: rgba(255,255,255,0.72);
      text-decoration: none;
      font-size: 0.95rem;
    }

    .title {
      margin-top: 6px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.03em;
    }

    .viewer {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      opacity: 0;
      transform: translateX(120px) scale(0.985);

      transition:
        transform 1.2s ease,
        opacity 1.2s ease;

      pointer-events: none;
      padding: 90px 24px 40px;
    }

    .slide.active {
      opacity: 1;
      transform: translateX(0) scale(1);
      pointer-events: auto;
    }

    .photo {
      width: min(88vw, 820px);
      height: min(76vh, 720px);

      object-fit: contain;
      object-position: center;

      border-radius: 22px;
      display: block;
    }

    .arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);

      width: 52px;
      height: 52px;
      border-radius: 50%;

      border: none;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);

      color: rgba(255,255,255,0.82);
      font-size: 1.5rem;
      cursor: pointer;
      z-index: 1000;

      transition: 0.25s ease;
    }

    .arrow:hover {
      background: rgba(255,255,255,0.14);
      transform: translateY(-50%) scale(1.05);
    }

    .left {
      left: 24px;
    }

    .right {
      right: 24px;
    }

    .counter {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.38);
      font-size: 0.72rem;
    }

    @media (max-width: 600px) {
      .photo {
        width: 92vw;
        height: 70vh;
        border-radius: 18px;
      }

      .arrow {
        width: 42px;
        height: 42px;
        font-size: 1.15rem;
      }

      .left {
        left: 12px;
      }

      .right {
        right: 12px;
      }
    }
  </style>
</head>

<body>

<div class="top-bar">
  <a href="map.html" class="back">
    ← Places
  </a>

  <div class="title">
    Rome
  </div>
</div>

<div class="viewer">

  <div class="slide active">
    <img src="rome1.jfif" class="photo" alt="Rome photo 1">
  </div>

  <div class="slide">
    <img src="rome2.jfif" class="photo" alt="Rome photo 2">
  </div>

  <div class="slide">
    <img src="rome3.jfif" class="photo" alt="Rome photo 3">
  </div>

</div>

<button class="arrow left" onclick="changeSlide(-1)">
  ‹
</button>

<button class="arrow right" onclick="changeSlide(1)">
  ›
</button>

<div class="counter" id="counter">
  1 / 3
</div>

<script>
const slides = document.querySelectorAll(".slide");
const counter = document.getElementById("counter");

let current = 0;
let busy = false;

function showSlide(index) {
  if (busy) return;
  busy = true;

  slides.forEach(slide => {
    slide.classList.remove("active");
  });

  setTimeout(() => {
    slides[index].classList.add("active");
    counter.textContent = `${index + 1} / ${slides.length}`;
  }, 120);

  setTimeout(() => {
    busy = false;
  }, 1200);
}

function changeSlide(direction) {
  current += direction;

  if (current < 0) {
    current = slides.length - 1;
  }

  if (current >= slides.length) {
    current = 0;
  }

  showSlide(current);
}

/* swipe */
let startX = 0;

document.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

document.addEventListener("touchend", e => {
  const endX = e.changedTouches[0].clientX;
  const diff = startX - endX;

  if (diff > 50) {
    changeSlide(1);
  }

  if (diff < -50) {
    changeSlide(-1);
  }
});
</script>

</body>
</html>
