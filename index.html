<!DOCTYPE html>
<html>
<head>
  <title>For Holly</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, serif;
      overflow-x: hidden;
      background: #000;
    }

    .hero {
      position: relative;
      min-height: 100vh;

      background-image:
        linear-gradient(
          to right,
          rgba(0,0,0,0.50) 0%,
          rgba(0,0,0,0.28) 30%,
          rgba(0,0,0,0.08) 60%,
          rgba(0,0,0,0.12) 100%
        ),
        url('hero.jpg.jfif');

      background-size: cover;
      background-position: center center;
      display: flex;
      align-items: flex-start;
    }

    .content {
      padding-left: 8%;
      padding-top: 10vh;
      color: white;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 3.1rem;
      font-weight: normal;
      letter-spacing: 1px;
      margin: 0 0 320px;
      color: rgba(255,255,255,0.94);
      text-shadow: 0 4px 20px rgba(0,0,0,0.35);
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .item {
      width: fit-content;
      font-size: 1.35rem;
      color: rgba(255,255,255,0.78);
      cursor: pointer;
      transition: all 0.28s ease;
      letter-spacing: 0.3px;
    }

    .item:hover {
      transform: translateX(6px);
      color: white;
    }

    @media (max-width: 900px) {
      .hero {
        background-position: 70% center;
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 250px;
      }

      .content {
        padding: 40px;
        padding-top: 10vh;
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
        margin-bottom: 180px;
      }

      .item {
        font-size: 1.15rem;
      }
    }
  </style>
</head>

<body>

<section class="hero">

  <div class="content">

    <h1>For Holly</h1>

    <div class="list">
      <div class="item">Memories</div>
      <div class="item">Adventures</div>
      <div class="item">Creations</div>
      <div class="item">Timeline</div>
    </div>

  </div>

</section>

</body>
</html>
