<!DOCTYPE html>
<html>
<head>
  <title>Map · For Holly</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Georgia, serif;
      color: white;
    }

    #map {
      height: 100vh;
      width: 100vw;
    }

    /* EXPERIMENTAL COLOUR VIBE */
    .leaflet-tile {
      filter:
        hue-rotate(95deg)
        saturate(1.6)
        brightness(0.92)
        contrast(1.12)
        sepia(0.35);
    }

    .overlay {
      position: absolute;
      top: 40px;
      left: 40px;
      z-index: 1000;
      text-shadow: 0 3px 16px rgba(0,0,0,0.45);
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      font-size: 0.95rem;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: 300;
    }

    .signature {
      position: fixed;
      bottom: 18px;
      left: 24px;
      z-index: 1000;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.45);
    }
  </style>
</head>

<body>

<div class="overlay">
  <a href="places.html" class="back">← Places</a>
  <h1 id="map-title">Places</h1>
</div>

<div id="map"></div>

<div class="signature">
Created with love by Rob Hartshorn · 2026
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const params = new URLSearchParams(window.location.search);
const mode = params.get("mode");

const map = L.map('map', {
  zoomControl: false
});

L.tileLayer(
'https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',
{
  noWrap: true
}
).addTo(map);

L.tileLayer(
'https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png',
{
  opacity: 0.28,
  noWrap: true
}
).addTo(map);

if (mode === "plane") {
  document.getElementById("map-title").textContent =
  "Plane Required";

  map.fitBounds([
    [-60, -180],
    [80, 180]
  ]);
}

else if (mode === "car") {
  document.getElementById("map-title").textContent =
  "Car Required";

  map.fitBounds([
    [49, -9],
    [60, 3]
  ]);
}

else if (mode === "legs") {
  document.getElementById("map-title").textContent =
  "Legs Required";

  map.fitBounds([
    [57.10, -2.65],
    [57.45, -2.00]
  ]);
}
</script>

</body>
</html>
