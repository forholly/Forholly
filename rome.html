<!DOCTYPE html>
<html>
<head>
  <title>Rome · For Holly</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #1a1a1a;
      font-family: Georgia, serif;
      color: white;
      touch-action: pan-y;
    }

    .top-bar {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 1000;
    }

    .back {
      color: rgba(255,255,255,0.72);
      text-decoration: none;
      font-size: 0.95rem;
    }

    .title {
      margin-top: 6px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.03em;
    }

    .viewer {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      inset: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      opacity: 0;
      transform: translateX(80px);

      transition:
        opacity 2.2s ease,
        transform 2.2s ease;

      pointer-events: none;
      padding: 90px 24px 40px;
    }

    .slide.active {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
      z-index: 2;
    }

    .slide.exit-left {
      opacity: 0;
      transform: translateX(-90px);
    }

    .slide.exit-right {
      opacity: 0;
      transform: translateX(90px);
    }

    .photo {
      width: min(88vw, 820px);
      height: min(76vh, 720px);
      object-fit: contain;
      border-radius: 20px;
      display: block;
    }

    .arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 1000;

      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: none;

      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);

      color: rgba(255,255,255,0.85);
      font-size: 1.5rem;
      cursor: pointer;

      transition: 0.25s ease;
    }

    .arrow:hover {
      background: rgba(255,255,255,0.15);
      transform: translateY(-50%) scale(1.05);
    }

    .left {
      left: 24px;
    }

    .right {
      right: 24px;
    }

    .counter {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.36);
      font-size: 0.72rem;
    }

    @media (max-width: 600px) {
      .photo {
        width: 92vw;
        height: 72vh;
      }

      .arrow {
        width: 42px;
        height: 42px;
        font-size: 1.15rem;
      }

      .left {
        left: 12px;
      }

      .right {
        right: 12px;
      }
    }
  </style>
</head>

<body>

<div class="top-bar">
  <a href="map.html" class="back">
    ← Places
  </a>

  <div class="title">
    Rome
  </div>
</div>

<div class="viewer">

  <div class="slide active">
    <img src="rome1.jfif" class="photo">
  </div>

  <div class="slide">
    <img src="rome2.jfif" class="photo">
  </div>

  <div class="slide">
    <img src="rome3.jfif" class="photo">
  </div>

</div>

<button class="arrow left" onclick="changeSlide(-1)">
  ‹
</button>

<button class="arrow right" onclick="changeSlide(1)">
  ›
</button>

<div class="counter" id="counter">
  1 / 3
</div>

<script>
const slides = document.querySelectorAll(".slide");
const counter = document.getElementById("counter");

let current = 0;
let transitionId = 0;

function changeSlide(direction) {

  transitionId++;

  const thisTransition = transitionId;
  const currentSlide = slides[current];

  currentSlide.classList.remove(
    "exit-left",
    "exit-right"
  );

  currentSlide.classList.add(
    direction === 1
      ? "exit-left"
      : "exit-right"
  );

  let next = current + direction;

  if (next < 0) next = slides.length - 1;
  if (next >= slides.length) next = 0;

  const nextSlide = slides[next];

  nextSlide.classList.add("active");

  current = next;

  counter.textContent =
    `${current + 1} / ${slides.length}`;

  setTimeout(() => {

    if (thisTransition !== transitionId)
      return;

    slides.forEach(slide => {

      slide.classList.remove(
        "exit-left",
        "exit-right"
      );

      if (slide !== slides[current]) {
        slide.classList.remove("active");
      }
    });

  }, 2200);
}

/* swipe support */
let startX = 0;

document.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

document.addEventListener("touchend", e => {
  const diff =
    startX - e.changedTouches[0].clientX;

  if (diff > 50) changeSlide(1);
  if (diff < -50) changeSlide(-1);
});
</script>

</body>
</html>
