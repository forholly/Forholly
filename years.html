<!DOCTYPE html>
<html>
<head>
  <title>Years · For Holly</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Georgia, serif;
      background: #000;
      color: white;
      overflow: hidden;
    }

    .hero {
      min-height: 100vh;

      background-image:
        linear-gradient(
          to right,
          rgba(0,0,0,0.45) 0%,
          rgba(0,0,0,0.22) 35%,
          rgba(0,0,0,0.08) 60%,
          rgba(0,0,0,0.12) 100%
        ),
        url('attack.jpg.jfif');

      background-size: cover;
      background-position: center 25%;
      background-repeat: no-repeat;
    }

    .container {
      padding: 8vh 8%;
    }

    .back {
      display: inline-block;
      margin-bottom: 30px;
      color: rgba(255,255,255,0.65);
      text-decoration: none;
      font-size: 0.95rem;
    }

    .years {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .year {
      width: fit-content;
      font-size: 1rem;
      font-weight: 300;
      color: rgba(255,255,255,0.78);
      text-decoration: none;
      transition: 0.25s ease;
    }

    .year:hover {
      transform: translateX(6px);
      color: white;
    }

    .signature {
      position: fixed;
      bottom: 18px;
      left: 24px;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.45);
    }

    @media (max-width: 600px) {
      .container {
        padding: 7vh 8%;
      }

      .year {
        font-size: 0.85rem;
      }

      .back {
        font-size: 0.85rem;
      }

      .signature {
        font-size: 0.55rem;
      }
    }
  </style>
</head>

<body>

<section class="hero">
  <div class="container">

    <a href="index.html" class="back">← Home</a>

    <div class="years">

      <a href="2013.html" class="year">2013</a>

      <a href="2018.html" class="year">2018</a>
      <a href="2019.html" class="year">2019</a>
      <a href="2020.html" class="year">2020</a>
      <a href="2021.html" class="year">2021</a>
      <a href="2022.html" class="year">2022</a>
      <a href="2023.html" class="year">2023</a>
      <a href="2024.html" class="year">2024</a>
      <a href="2025.html" class="year">2025</a>
      <a href="2026.html" class="year">2026</a>
    </div>

  </div>

  <div class="signature">
    Created with love by Rob Hartshorn · 2026
  </div>
</section>

</body>
</html>
