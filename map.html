<!DOCTYPE html>
<html>
<head>
  <title>Map · For Holly</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #0c1016;
      font-family: Georgia, serif;
      color: white;
    }

    #globeViz {
      width: 100vw;
      height: 100vh;
    }

    .overlay {
      position: absolute;
      top: 40px;
      left: 40px;
      z-index: 1000;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: rgba(255,255,255,0.78);
      text-decoration: none;
      font-size: 0.95rem;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: 300;
    }

    .signature {
      position: fixed;
      bottom: 18px;
      left: 24px;
      z-index: 1000;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.45);
    }
  </style>

  <script src="https://unpkg.com/three"></script>
  <script src="https://unpkg.com/globe.gl"></script>
</head>

<body>

<div class="overlay">
  <a href="places.html" class="back">← Places</a>
  <h1 id="map-title">Places</h1>
</div>

<div id="globeViz"></div>

<div class="signature">
Created with love by Rob Hartshorn · 2026
</div>

<script>
const params = new URLSearchParams(window.location.search);
const mode = params.get("mode");

const globe = Globe()
(document.getElementById('globeViz'))

.globeImageUrl(
'https://unpkg.com/three-globe/example/img/earth-topology.png'
)

.bumpImageUrl(
'https://unpkg.com/three-globe/example/img/earth-topology.png'
)

.backgroundColor('#0c1016')

.showAtmosphere(true)
.atmosphereColor('#89a8ff')
.atmosphereAltitude(0.12);

if (mode === "plane") {

  document.getElementById("map-title")
    .textContent = "Plane Required";

  globe.pointOfView({
    lat: 20,
    lng: 0,
    altitude: 2.2
  }, 1200);
}

else if (mode === "car") {

  document.getElementById("map-title")
    .textContent = "Car Required";

  globe.pointOfView({
    lat: 55,
    lng: -3,
    altitude: 0.38
  }, 1600);
}

else if (mode === "legs") {

  document.getElementById("map-title")
    .textContent = "Legs Required";

  globe.pointOfView({
    lat: 57.33,
    lng: -2.38,
    altitude: 0.04
  }, 1800);
}
</script>

</body>
</html>
