<!DOCTYPE html>
<html>
<head>
  <title>Rome · For Holly</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #111;
      font-family: Georgia, serif;
      color: white;
    }

    body {
      overflow-x: hidden;
    }

    .top-bar {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 1000;
    }

    .back {
      color: rgba(255,255,255,0.72);
      text-decoration: none;
      font-size: 0.95rem;
    }

    .title {
      margin-top: 6px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.03em;
    }

    .gallery {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 90px 0 50px;
    }

    .photo-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .photo {
      width: min(92vw, 850px);
      height: auto;
      border-radius: 18px;
      display: block;
    }

    .signature {
      text-align: center;
      font-size: 0.65rem;
      color: rgba(255,255,255,0.35);
      padding: 30px 0 40px;
    }

    @media (max-width: 600px) {
      .back {
        font-size: 0.85rem;
      }

      .title {
        font-size: 0.72rem;
      }

      .gallery {
        gap: 14px;
        padding-top: 80px;
      }

      .photo {
        width: 96vw;
        border-radius: 14px;
      }
    }
  </style>
</head>

<body>

<div class="top-bar">
  <a href="map.html" class="back">
    ← Places
  </a>

  <div class="title">
    Rome
  </div>
</div>

<div class="gallery">

  <div class="photo-wrap">
    <img src="rome1.jfif" class="photo" alt="Rome photo 1">
  </div>

  <div class="photo-wrap">
    <img src="rome2.jfif" class="photo" alt="Rome photo 2">
  </div>

  <div class="photo-wrap">
    <img src="rome3.jfif" class="photo" alt="Rome photo 3">
  </div>

</div>

<div class="signature">
  Created with love by Rob Hartshorn · 2026
</div>

</body>
</html>
