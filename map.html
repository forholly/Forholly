<!DOCTYPE html>
<html>
<head>
  <title>For Holly</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #f3d5dd;
      font-family: Georgia, serif;
    }

    #map {
      height: 100vh;
      width: 100vw;

      filter:
        hue-rotate(-95deg)
        saturate(2.8)
        brightness(1.12)
        contrast(0.92);
    }

    .home-wrap {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 1000;
    }

    .home {
      color: rgba(255,255,255,0.88);
      text-decoration: none;
      font-size: 1rem;
      display: block;
    }

    .country-count {
      margin-top: 5px;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.58);
      letter-spacing: 0.02em;
    }

    .signature {
      position: fixed;
      bottom: 18px;
      left: 24px;
      z-index: 1000;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.55);
    }

    .memory-pin {
      width: 8px;
      height: 8px;
      background: #ffd166;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.4);
      box-shadow: 0 0 5px rgba(255,209,102,0.3);
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .home {
        font-size: 0.9rem;
      }

      .country-count {
        font-size: 0.62rem;
      }

      .signature {
        font-size: 0.55rem;
      }
    }
  </style>
</head>

<body>

<div class="home-wrap">
  <a href="index.html" class="home">
    ← Home
  </a>

  <div class="country-count">
    Countries visited · 8
  </div>
</div>

<div id="map"></div>

<div class="signature">
  Created with love by Rob Hartshorn · 2026
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map("map", {
  zoomControl: false,
  attributionControl: false,
  worldCopyJump: false
});

L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
  {
    subdomains: "abcd",
    noWrap: true
  }
).addTo(map);

const memoryIcon = L.divIcon({
  className: "",
  html: '<div class="memory-pin"></div>',
  iconSize: [8, 8],
  iconAnchor: [4, 4]
});

function addPin(lat, lng, page = "place-template.html") {
  const marker = L.marker([lat, lng], {
    icon: memoryIcon
  }).addTo(map);

  marker.on("click", () => {
    window.location.href = page;
  });
}

// Special pages
addPin(41.9028, 12.4964, "rome.html"); // Rome
addPin(50.7350, -1.7830, "highcliffe.html"); // Highcliffe

// Shared clickable placeholders
addPin(52.3676, 4.9041); // Amsterdam
addPin(54.3520, 18.6466); // Gdansk
addPin(52.5200, 13.4050); // Berlin
addPin(57.1475, -2.0954); // Aberdeen
addPin(57.2842, -2.3776); // Inverurie
addPin(57.3348, -2.3202); // Oldmeldrum
addPin(55.9533, -3.1883); // Edinburgh
addPin(57.1950, -3.8260); // Aviemore
addPin(36.5390, -4.6244); // Fuengirola
addPin(51.5072, -0.1276); // London
addPin(34.7754, 32.4245); // Cyprus
addPin(57.1440, -4.6817); // Caledonian Canal
addPin(52.1364, -0.4667); // Bedford

map.setView([56, -3], 5.8);
</script>

</body>
</html>
