<!DOCTYPE html>
<html>
<head>
  <title>For Holly</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #181416;
      font-family: Georgia, serif;
    }

    #map {
      height: 100vh;
      width: 100vw;
    }

    /* softer controlled tint */
    .leaflet-tile {
      filter:
        sepia(0.22)
        hue-rotate(-18deg)
        saturate(1.7)
        brightness(1.02);
    }

    .home {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 1000;
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      font-size: 1rem;
    }

    .signature {
      position: fixed;
      bottom: 18px;
      left: 24px;
      z-index: 1000;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.45);
    }

    .memory-pin {
      width: 8px;
      height: 8px;
      background: #ff7cad;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.35);
      box-shadow: 0 0 4px rgba(255,124,173,0.18);
    }

    @media (max-width: 600px) {
      .home {
        font-size: 0.9rem;
      }

      .signature {
        font-size: 0.55rem;
      }
    }
  </style>
</head>

<body>

<a href="index.html" class="home">
  ← Home
</a>

<div id="map"></div>

<div class="signature">
  Created with love by Rob Hartshorn · 2026
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const map = L.map("map", {
    zoomControl: false,
    attributionControl: false,
    worldCopyJump: false
  });

  L.tileLayer(
    "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
    {
      subdomains: "abcd",
      noWrap: true
    }
  ).addTo(map);

  const memoryIcon = L.divIcon({
    className: "",
    html: '<div class="memory-pin"></div>',
    iconSize: [8, 8],
    iconAnchor: [4, 4]
  });

  function addPin(lat, lng) {
    L.marker([lat, lng], {
      icon: memoryIcon
    }).addTo(map);
  }

  addPin(41.9028, 12.4964);
  addPin(52.3676, 4.9041);
  addPin(54.3520, 18.6466);
  addPin(52.5200, 13.4050);
  addPin(50.7350, -1.7830);
  addPin(57.1475, -2.0954);
  addPin(57.2842, -2.3776);
  addPin(57.3348, -2.3202);

  map.setView([56, -3], 5.8);
</script>

</body>
</html>
