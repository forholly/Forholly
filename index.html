<!DOCTYPE html>
<html>
<head>
  <title>For Holly</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f3d5dd;
      font-family: Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 24px;
    }

    h1 {
      font-size: clamp(2.2rem, 7vw, 4rem);
      font-weight: normal;
      color: rgba(60,60,60,0.9);
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 1rem;
      color: rgba(60,60,60,0.55);
      margin-bottom: 40px;
    }

    .button-wrap {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
    }

    .map-button {
      width: min(280px, 78vw);
      padding: 16px 22px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 1rem;
      transition: transform 0.2s ease;
      border: none;
      cursor: pointer;
      display: inline-block;
    }

    .map-button:hover {
      transform: scale(1.02);
    }

    .holly {
      background: rgba(255,255,255,0.6);
      color: rgba(60,60,60,0.9);
    }

    .dad {
      background: rgba(30,30,30,0.88);
      color: rgba(255,255,255,0.9);
    }

    .signature {
      position: fixed;
      bottom: 18px;
      left: 24px;
      font-size: 0.7rem;
      color: rgba(60,60,60,0.45);
    }

    @media (max-width: 600px) {
      .signature {
        font-size: 0.55rem;
      }
    }
  </style>
</head>

<body>

<div class="container">
  <h1>For Holly</h1>

  <div class="subtitle">
    Little places that mattered
  </div>

  <div class="button-wrap">
    <a href="map.html" class="map-button holly">
      Holly's Map
    </a>

    <a href="dad-map.html" class="map-button dad">
      Dad Places
    </a>
  </div>
</div>

<div class="signature">
  Created with love by Rob Hartshorn · 2026
</div>

</body>
</html>
