<!DOCTYPE html>
<html>
<head>
  <title>Places · For Holly</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Georgia, serif;
      color: white;
    }

    #map {
      height: 100vh;
      width: 100vw;
    }

    /* THE WEIRD COLOURS */
    .leaflet-tile {
      filter:
        hue-rotate(115deg)
        saturate(1.35)
        brightness(0.82)
        contrast(1.08);
    }

    .overlay {
      position: absolute;
      top: 40px;
      left: 40px;
      z-index: 1000;
      text-shadow: 0 3px 16px rgba(0,0,0,0.45);
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: rgba(255,255,255,0.78);
      text-decoration: none;
      font-size: 0.95rem;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: 300;
    }

    .signature {
      position: fixed;
      bottom: 18px;
      left: 24px;
      z-index: 1000;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.45);
    }

    @media (max-width: 600px) {
      .overlay {
        top: 25px;
        left: 25px;
      }

      h1 {
        font-size: 1.5rem;
      }

      .back {
        font-size: 0.85rem;
      }

      .signature {
        font-size: 0.55rem;
      }
    }
  </style>
</head>

<body>

<div class="overlay">
  <a href="places.html" class="back">← Places</a>
  <h1>Our World</h1>
</div>

<div id="map"></div>

<div class="signature">
Created with love by Rob Hartshorn · 2026
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map', {
  zoomControl: true
}).setView([35, 0], 2);

L.tileLayer(
'https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',
{
  noWrap: false
}
).addTo(map);

L.tileLayer(
'https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png',
{
  opacity: 0.28
}
).addTo(map);
</script>

</body>
</html>
