<!DOCTYPE html>
<html>
<head>
  <title>Dad's Travels · For Holly</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: Georgia, serif;
    }

    #map {
      height: 100vh;
      width: 100vw;

      filter:
        saturate(1.15)
        brightness(0.98)
        contrast(1.08);
    }

    .home-wrap {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 1000;
    }

    .home {
      color: rgba(45,45,45,0.88);
      text-decoration: none;
      font-size: 1rem;
      display: block;
    }

    .country-count {
      margin-top: 5px;
      font-size: 0.72rem;
      color: rgba(45,45,45,0.68);
      letter-spacing: 0.02em;
    }

    .signature {
      position: fixed;
      bottom: 18px;
      left: 24px;
      z-index: 1000;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.45);
    }

    .memory-pin {
      width: 8px;
      height: 8px;
      background: #1a1a1a;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 0 2px rgba(0,0,0,0.28);
    }

    .tiny-popup {
      font-family: Georgia, serif;
      font-size: 12px;
      color: #222;
    }

    .tiny-popup a {
      text-decoration: none;
      color: #222;
    }

    @media (max-width: 600px) {
      .home {
        font-size: 0.9rem;
      }

      .country-count {
        font-size: 0.62rem;
      }

      .signature {
        font-size: 0.55rem;
      }
    }
  </style>
</head>

<body>

<div class="home-wrap">
  <a href="index.html" class="home">
    ← Home
  </a>

  <div class="country-count">
    Countries visited · 34
  </div>
</div>

<div id="map"></div>

<div class="signature">
  Created with love by Rob Hartshorn · 2026
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map("map", {
  zoomControl: false,
  attributionControl: false,
  worldCopyJump: false
});

L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png",
  {
    subdomains: "abcd",
    noWrap: true
  }
).addTo(map);

const pane = map.createPane("tintPane");
pane.style.zIndex = 350;
pane.style.mixBlendMode = "soft-light";

L.rectangle(
  [[-90, -180], [90, 180]],
  {
    pane: "tintPane",
    color: "#2a5f73",
    fillColor: "#2a5f73",
    fillOpacity: 0.14,
    stroke: false
  }
).addTo(map);

L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png",
  {
    opacity: 0.28,
    subdomains: "abcd"
  }
).addTo(map);

const memoryIcon = L.divIcon({
  className: "",
  html: '<div class="memory-pin"></div>',
  iconSize: [8,8],
  iconAnchor: [4,4]
});

function addPin(lat, lng, options = {}) {

  const marker = L.marker([lat, lng], {
    icon: memoryIcon
  }).addTo(map);

  // Shared memories
  if (options.shared) {

    const popupContent = options.link
      ? `<div class="tiny-popup">
          <a href="${options.link}">
            Holly memories →
          </a>
        </div>`
      : `<div class="tiny-popup">
          Holly memories
        </div>`;

    marker.bindPopup(popupContent);
    return;
  }

  // Dad-only note
  if (options.note) {
    marker.bindPopup(`
      <div class="tiny-popup">
        ${options.note}
      </div>
    `);
    return;
  }
}

/* Shared places */
addPin(41.9028, 12.4964, {
  shared: true,
  link: "rome.html"
});

addPin(50.7350, -1.7830);

addPin(52.3676, 4.9041, {
  shared: true
});

addPin(54.3520, 18.6466);
addPin(52.5200, 13.4050);
addPin(57.1475, -2.0954);
addPin(57.2842, -2.3776);
addPin(57.3348, -2.3202);
addPin(55.9533, -3.1883);
addPin(57.1950, -3.8260);
addPin(36.5390, -4.6244);
addPin(51.5072, -0.1276);
addPin(34.7754, 32.4245);
addPin(57.1440, -4.6817);
addPin(52.1364, -0.4667);

/* Europe / UK */
addPin(54.5973, -5.9301);
addPin(58.1467, 7.9956);
addPin(60.3913, 5.3221);
addPin(58.2970, 6.6604);
addPin(59.6040, 5.8070);
addPin(50.9513, 1.8587);
addPin(57.4125, -6.1940);
addPin(56.4978, -6.8692);
addPin(58.9847, -2.9605);
addPin(60.1550, -1.1450);
addPin(50.8503, 4.3517);
addPin(68.9585, 33.0827);
addPin(56.9496, 24.1052);
addPin(49.2144, -2.1313);
addPin(37.1028, -8.6742);

/* Spain / islands */
addPin(38.5411, -0.1225);
addPin(36.5957, -4.6373);
addPin(36.1408, -5.3536);
addPin(28.1235, -15.4363);
addPin(28.5004, -13.8627);

/* Africa */
addPin(6.5244, 3.3792);
addPin(5.3599, -4.0083);
addPin(5.6037, -0.1870);
addPin(-4.4419, 15.2663);
addPin(-8.8390, 13.2894);
addPin(30.0444, 31.2357);

/* Middle East */
addPin(29.3759, 47.9774);
addPin(25.2854, 51.5310);
addPin(24.4539, 54.3773);

/* Asia */
addPin(18.7883, 98.9853);
addPin(13.7563, 100.5018);
addPin(3.1390, 101.6869);
addPin(3.8168, 103.3317);
addPin(2.6931, 101.7498);

addPin(19.0760, 72.8777, {
  note: "India"
});

addPin(22.5726, 88.3639);
addPin(12.9716, 77.5946);
addPin(17.3850, 78.4867);
addPin(11.6234, 92.7265);
addPin(12.0480, 102.3210);
addPin(35.5384, 129.3114);

/* Americas */
addPin(36.1699, -115.1398);
addPin(39.9526, -75.1652);
addPin(35.0844, -106.6504);
addPin(41.8781, -87.6298);
addPin(43.6591, -70.2568);
addPin(64.8378, -147.7164);
addPin(19.4326, -99.1332);
addPin(18.6517, -91.8075);
addPin(4.7110, -74.0721);
addPin(10.3910, -75.4794);
addPin(53.5461, -113.4938);
addPin(53.3017, -60.3258);

/* Other */
addPin(13.1939, -59.5432);
addPin(-31.9505, 115.8605);

map.setView([30, 0], 2.2);
</script>

</body>
</html>
