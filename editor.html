<!DOCTYPE html>
<html>
<head>
  <title>For Holly Editor</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f2ee;
      font-family: Georgia, serif;
      color: #222;
      padding: 40px 20px;
    }

    .wrap {
      max-width: 760px;
      margin: auto;
    }

    h1 {
      font-weight: normal;
      margin-bottom: 30px;
    }

    .subtle {
      color: rgba(0,0,0,0.55);
      margin-bottom: 35px;
      font-size: 0.95rem;
    }

    label {
      display: block;
      margin-top: 24px;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid rgba(0,0,0,0.14);
      border-radius: 10px;
      font-family: Georgia, serif;
      font-size: 1rem;
      background: white;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
      line-height: 1.6;
    }

    input[type="file"] {
      margin-top: 10px;
    }

    .checkboxes {
      display: flex;
      gap: 28px;
      margin-top: 8px;
    }

    .checkboxes label {
      margin: 0;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button {
      margin-top: 40px;
      padding: 14px 22px;
      border: none;
      border-radius: 10px;
      background: #e8d9dd;
      font-family: Georgia, serif;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.92;
    }

    .status {
      margin-top: 20px;
      color: rgba(0,0,0,0.65);
    }
  </style>
</head>

<body>

<div class="wrap">

  <h1>For Holly Editor</h1>

  <div class="subtle">
    Create a memory page.
  </div>

  <label>Who remembers this?</label>

  <div class="checkboxes">
    <label>
      <input type="checkbox" id="dad">
      Dad
    </label>

    <label>
      <input type="checkbox" id="holly">
      Holly
    </label>
  </div>

  <label>Location *</label>
  <input
    type="text"
    id="location"
    placeholder="Floro"
  >

  <label>Page title *</label>
  <input
    type="text"
    id="title"
    placeholder="COVID in Floro"
  >

  <label>Story</label>
  <textarea
    id="story"
    placeholder="Optional..."
  ></textarea>

  <label>Photos</label>
  <input
    type="file"
    id="photos"
    multiple
    accept="image/*"
  >

  <button onclick="createPage()">
    Create Page
  </button>

  <div class="status" id="status"></div>

</div>

<script>
function slugify(text) {
  return text
    .toLowerCase()
    .trim()
    .replace(/\s+/g, "-")
    .replace(/[^\w\-]+/g, "");
}

function readFiles(files) {
  return Promise.all(
    Array.from(files).map(file => {
      return new Promise(resolve => {
        const reader = new FileReader();

        reader.onload = e => {
          resolve(e.target.result);
        };

        reader.readAsDataURL(file);
      });
    })
  );
}

async function createPage() {

  const dad =
    document.getElementById("dad").checked;

  const holly =
    document.getElementById("holly").checked;

  const location =
    document.getElementById("location")
    .value
    .trim();

  const title =
    document.getElementById("title")
    .value
    .trim();

  const story =
    document.getElementById("story")
    .value
    .trim();

  const files =
    document.getElementById("photos")
    .files;

  const status =
    document.getElementById("status");

  if (!location) {
    alert("Please add a location.");
    return;
  }

  if (!title) {
    alert("Please add a page title.");
    return;
  }

  let prefix = "holly";

  if (dad && holly) {
    prefix = "shared";
  } else if (dad) {
    prefix = "dad";
  }

  const filename =
    `${prefix}-${slugify(location)}.html`;

  let navLink =
    '<a href="map.html">← Holly\\'s Places</a>';

  if (prefix === "dad") {
    navLink =
      '<a href="dad-.html">← Dad\\'s Places</a>';
  }

  if (prefix === "shared") {
    navLink =
      '<a href="dad-.html">← Dad\\'s Places</a>';
  }

  status.innerText = "Building page...";

  const images =
    await readFiles(files);

  const imageHtml =
    images.map(img => `
      <img
        src="${img}"
        class="hero-image"
      >
    `).join("");

  const html = `
<!DOCTYPE html>
<html>
<head>
  <title>${title} · For Holly</title>

  <meta name="viewport"
    content="width=device-width, initial-scale=1">

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:#f5f2ee;
      font-family:Georgia, serif;
      color:#222;
    }

    .nav{
      position:fixed;
      top:24px;
      left:24px;
      z-index:1000;
    }

    .nav a{
      display:block;
      color:rgba(45,45,45,0.88);
      text-decoration:none;
      margin-bottom:6px;
    }

    .wrap{
      max-width:920px;
      margin:auto;
      padding:90px 20px 80px;
    }

    .hero-image{
      width:100%;
      border-radius:14px;
      margin-bottom:18px;
      display:block;
    }

    h1{
      font-weight:normal;
      margin-top:34px;
      margin-bottom:22px;
    }

    .story{
      line-height:1.75;
      font-size:1.04rem;
    }

    .signature{
      margin-top:60px;
      color:rgba(0,0,0,0.45);
      font-size:0.8rem;
    }
  </style>
</head>

<body>

<div class="nav">
  <a href="index.html">
    ← Home
  </a>

  ${navLink}
</div>

<div class="wrap">

  ${imageHtml}

  <h1>${title}</h1>

  <div class="story">
    ${story.replace(/\n/g, "<br>")}
  </div>

  <div class="signature">
    Created with love by Rob Hartshorn · 2026
  </div>

</div>

</body>
</html>
`;

  const blob = new Blob(
    [html],
    { type: "text/html" }
  );

  const a =
    document.createElement("a");

  a.href =
    URL.createObjectURL(blob);

  a.download =
    filename;

  a.click();

  status.innerText =
    `Downloaded ${filename}`;
}
</script>

</body>
</html>
