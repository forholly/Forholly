<!DOCTYPE html>
<html>
<head>
  <title>For Holly Editor</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f2ee;
      font-family: Georgia, serif;
      color: #222;
      padding: 40px 20px;
    }

    .wrap {
      max-width: 760px;
      margin: auto;
    }

    h1 {
      font-weight: normal;
      margin-bottom: 12px;
    }

    .subtle {
      color: rgba(0,0,0,0.55);
      margin-bottom: 35px;
      font-size: 0.95rem;
    }

    label {
      display: block;
      margin-top: 24px;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid rgba(0,0,0,0.14);
      border-radius: 10px;
      font-family: Georgia, serif;
      font-size: 1rem;
      background: white;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
      line-height: 1.6;
    }

    .checkboxes {
      display: flex;
      gap: 28px;
      margin-top: 8px;
    }

    .checkboxes label {
      margin: 0;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button {
      margin-top: 40px;
      padding: 14px 22px;
      border: none;
      border-radius: 10px;
      background: #e8d9dd;
      font-family: Georgia, serif;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.92;
    }
  </style>
</head>

<body>

<div class="wrap">

  <h1>For Holly Editor</h1>

  <div class="subtle">
    Create a memory page.
  </div>

  <label>Who remembers this?</label>

  <div class="checkboxes">
    <label>
      <input type="checkbox" id="dad">
      Dad
    </label>

    <label>
      <input type="checkbox" id="holly">
      Holly
    </label>
  </div>

  <label>Location *</label>
  <input
    type="text"
    id="location"
    placeholder="Location"
  >

  <label>Page title *</label>
  <input
    type="text"
    id="title"
    placeholder="Page title"
  >

  <label>Story</label>
  <textarea
    id="story"
    placeholder="Optional..."
  ></textarea>

  <button onclick="createPage()">
    Create Page
  </button>

</div>

<script>
function slugify(text) {
  return text
    .toLowerCase()
    .trim()
    .replace(/\s+/g, "-")
    .replace(/[^\w\-]+/g, "");
}

function createPage() {

  const dad =
    document.getElementById("dad").checked;

  const holly =
    document.getElementById("holly").checked;

  const location =
    document.getElementById("location")
    .value
    .trim();

  const title =
    document.getElementById("title")
    .value
    .trim();

  const story =
    document.getElementById("story")
    .value
    .trim();

  if (!location) {
    alert("Please add a location.");
    return;
  }

  if (!title) {
    alert("Please add a page title.");
    return;
  }

  let prefix = "holly";

  if (dad && holly) {
    prefix = "shared";
  } else if (dad) {
    prefix = "dad";
  }

  const filename =
    prefix + "-" +
    slugify(location) +
    ".html";

  let mapLink =
    "map.html";

  let mapText =
    "← Holly's Places";

  if (prefix === "dad") {
    mapLink = "dad-";
    mapText = "← Dad's Places";
  }

  const html =
`<!DOCTYPE html>
<html>
<head>
  <title>${title} · For Holly</title>

  <meta name="viewport"
  content="width=device-width, initial-scale=1">

  <style>
    body{
      margin:0;
      background:#f5f2ee;
      font-family:Georgia, serif;
      color:#222;
    }

    .nav{
      position:fixed;
      top:24px;
      left:24px;
    }

    .nav a{
      display:block;
      text-decoration:none;
      color:rgba(45,45,45,0.88);
      margin-bottom:6px;
    }

    .wrap{
      max-width:900px;
      margin:auto;
      padding:90px 20px 80px;
    }

    h1{
      font-weight:normal;
      margin-bottom:24px;
    }

    .story{
      line-height:1.75;
      font-size:1.04rem;
    }
  </style>
</head>

<body>

<div class="nav">

  <a href="index.html">
    ← Home
  </a>

  <a href="${mapLink}">
    ${mapText}
  </a>

</div>

<div class="wrap">

  <h1>${title}</h1>

  <div class="story">
    ${story.replace(/\n/g, "<br>")}
  </div>

</div>

</body>
</html>`;

  const blob = new Blob(
    [html],
    { type: "text/html" }
  );

  const a =
    document.createElement("a");

  a.href =
    URL.createObjectURL(blob);

  a.download =
    filename;

  document.body.appendChild(a);

  a.click();

  document.body.removeChild(a);

  URL.revokeObjectURL(a.href);
}
</script>

</body>
</html>
