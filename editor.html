<!DOCTYPE html>
<html>
<head>
  <title>For Holly Editor</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      background: #f5f2ee;
      font-family: Georgia, serif;
      color: #222;
      padding: 40px 20px;
    }

    .wrap {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      font-weight: normal;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 22px;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(0,0,0,0.15);
      border-radius: 8px;
      font-family: Georgia, serif;
      font-size: 1rem;
      background: white;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    .checkboxes {
      display: flex;
      gap: 24px;
      margin-top: 10px;
    }

    .checkboxes label {
      margin: 0;
    }

    button {
      margin-top: 35px;
      padding: 14px 22px;
      border: none;
      border-radius: 8px;
      background: #e8d9dd;
      font-family: Georgia, serif;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

<div class="wrap">

  <h1>For Holly Editor</h1>

  <label>Who remembers this?</label>

  <div class="checkboxes">
    <label>
      <input type="checkbox" id="dad">
      Dad
    </label>

    <label>
      <input type="checkbox" id="holly">
      Holly
    </label>
  </div>

  <label>Location</label>
  <input type="text" id="location" placeholder="Feda">

  <label>Page title</label>
  <input type="text" id="title" placeholder="Spent COVID in Feda">

  <label>Story</label>
  <textarea id="story"></textarea>

  <button onclick="createPage()">
    Create Page
  </button>

</div>

<script>
function slugify(text) {
  return text
    .toLowerCase()
    .trim()
    .replace(/\s+/g, "-")
    .replace(/[^\w\-]+/g, "");
}

function createPage() {

  const dad = document.getElementById("dad").checked;
  const holly = document.getElementById("holly").checked;

  const location =
    document.getElementById("location").value.trim();

  const title =
    document.getElementById("title").value.trim();

  const story =
    document.getElementById("story").value.trim();

  let prefix = "";

  if (dad && holly) {
    prefix = "shared";
  } else if (dad) {
    prefix = "dad";
  } else {
    prefix = "holly";
  }

  const filename =
    `${prefix}-${slugify(location)}.html`;

  const html = `
<!DOCTYPE html>
<html>
<head>
<title>${title} · For Holly</title>

<meta name="viewport"
content="width=device-width, initial-scale=1">

<style>
body{
margin:0;
background:#f5f2ee;
font-family:Georgia,serif;
color:#222;
}

.wrap{
max-width:900px;
margin:auto;
padding:40px 20px;
}

.hero{
width:100%;
border-radius:12px;
margin-bottom:30px;
}

h1{
font-weight:normal;
margin-bottom:20px;
}

.story{
line-height:1.7;
font-size:1.05rem;
}
</style>
</head>

<body>

<div class="wrap">

<h1>${title}</h1>

<div class="story">
${story.replace(/\n/g, "<br>")}
</div>

</div>

</body>
</html>
`;

  const blob = new Blob([html], {
    type: "text/html"
  });

  const a = document.createElement("a");

  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}
</script>

</body>
</html>
